name: edi coverage and static checks
run-name: edi metrics ${{ inputs.edi_sha || 'main' }}

on:
  workflow_dispatch:
    inputs:
      edi_sha:
        description: Full edi commit SHA to measure (blank for main)
        type: string
  schedule:
    - cron: '15 7 * * *'
      timezone: Europe/Stockholm

permissions:
  contents: read

concurrency:
  group: quality-edi-measurements-${{ inputs.edi_sha || 'main' }}
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate the optional edi commit
        env:
          EDI_SHA: ${{ inputs.edi_sha }}
        run: |
          if [[ -n "$EDI_SHA" && ! "$EDI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Expected a full edi commit SHA'
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          repository: enhantica/edi
          ref: ${{ inputs.edi_sha || 'main' }}
          path: inputs/edi
          fetch-depth: 0
          persist-credentials: false
      - name: Read the locked crysta commit
        id: pin
        working-directory: inputs/edi
        run: bash tools/ci/crysta-source.sh
      - name: Authorize the private checkout
        id: source-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.QUALITY_APP_ID || vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.QUALITY_APP_KEY || secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta,edi
          permission-contents: read
          permission-actions: read
      - uses: actions/checkout@v5
        with:
          repository: enhantica/crysta
          ref: ${{ steps.pin.outputs.sha }}
          path: inputs/crysta
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
      - name: Find a qualified Linux SDK from the same edi commit
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          CRYSTA_PIN: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          edi_sha="$(git -C inputs/edi rev-parse HEAD)"
          run_ids="$(gh run list --repo enhantica/edi --workflow ci.yml --commit "$edi_sha" --limit 5 --json databaseId --jq '.[].databaseId')"
          for run_id in $run_ids; do
            job_id="$(gh api "repos/enhantica/edi/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.name == "crysta-sdk / crysta SDK · linux-64" and .conclusion == "success")] | .[0].id // empty')"
            if [[ -z "$job_id" ]]; then continue; fi
            sdk="$(gh api "repos/enhantica/edi/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | select(.name == "crysta-sdk-linux-64" and .expired == false)] | .[0].id // empty')"
            if [[ -z "$sdk" ]]; then continue; fi
            download="$RUNNER_TEMP/edi-sdk-download"
            gh run download "$run_id" --repo enhantica/edi --name crysta-sdk-linux-64 --dir "$download"
            archive="crysta-sdk-$CRYSTA_PIN-linux-64.tar.gz"
            (
              cd "$download"
              sha256sum -- "$archive" | cmp -s - "$archive.sha256"
            )
            sdk_dir="$RUNNER_TEMP/edi-qualified-sdk"
            mkdir -p "$sdk_dir"
            mv -- "$download/$archive" "$sdk_dir/"
            rm -rf -- "$download"
            printf 'EDI_QUALIFIED_SDK=%s\n' "$sdk_dir" >> "$GITHUB_ENV"
            printf 'Using qualified Linux SDK from edi run %s\n' "$run_id"
            break
          done
      - uses: ./inputs/edi/.github/actions/setup-pixi
        with:
          manifest-path: inputs/edi/pixi.toml
          environments: default
          cache: false
      - name: Run source-safe Linux measurements
        env:
          CRYSTA_PIN: ${{ steps.pin.outputs.sha }}
        run: python3 -u scripts/edi_measure.py
      - name: Retain only normalized measurements
        uses: actions/upload-artifact@v4
        with:
          name: edi-measurements
          path: measurement/edi.json
          if-no-files-found: error
  publish:
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Request dashboard publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quality.yml --repo "$GITHUB_REPOSITORY" --ref main -f sdk_refresh=true
