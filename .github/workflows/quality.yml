name: Code quality dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect_only:
        description: Collect metrics as an Actions artifact without deploying Pages
        type: boolean
        default: false
      sdk_refresh:
        description: Publish a completed SDK receipt without queuing new measurements
        type: boolean
        default: false
  workflow_run:
    workflows: [edi coverage and static checks]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '25 8 * * *'
      timezone: Europe/Stockholm
    - cron: '25 0-7,9-23 * * *'
      timezone: Europe/Stockholm

permissions:
  contents: read

concurrency:
  group: quality-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      refresh: ${{ steps.plan.outputs.refresh }}
    permissions:
      contents: read
      actions: read
    env:
      PUBLISH_LIVE: ${{ vars.QUALITY_PUBLISH_LIVE }}
      COLLECT_METRICS: ${{ vars.QUALITY_PUBLISH_LIVE == 'true' || inputs.collect_only == true }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Authorize read access to the product repositories
        if: env.COLLECT_METRICS == 'true'
        id: source-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.QUALITY_APP_ID || vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.QUALITY_APP_KEY || secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta,edi
          permission-contents: read
          permission-actions: read
      - name: Read durable metrics history
        if: env.COLLECT_METRICS == 'true'
        uses: actions/checkout@v5
        with:
          ref: metrics-history
          path: history
          persist-credentials: false
      - name: Discover published releases and changed SDK pins
        if: env.COLLECT_METRICS == 'true'
        id: releases
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: python3 scripts/releases.py --history history/snapshots.json --output "$RUNNER_TEMP/releases.json"
      - name: Choose whether to refresh
        id: plan
        env:
          RELEASE_CHECK: ${{ github.event_name == 'schedule' && github.event.schedule == '25 0-7,9-23 * * *' }}
          RELEASE_CHANGED: ${{ steps.releases.outputs.changed }}
        run: |
          if [[ "$RELEASE_CHECK" == true && "$RELEASE_CHANGED" != true ]]; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out edi main
        if: env.COLLECT_METRICS == 'true' && steps.plan.outputs.refresh == 'true'
        uses: actions/checkout@v5
        with:
          repository: enhantica/edi
          ref: main
          path: inputs/edi
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          sparse-checkout: |
            core/include
            core/src
            cli
            lib/src
            lib/edi
            lib/easydiffraction
            app/src
            assistant/native
      - name: Install BCA and Doxygen
        if: env.COLLECT_METRICS == 'true' && steps.plan.outputs.refresh == 'true'
        env:
          BCA_VERSION: '2.6.0'
          BCA_SHA256: '53df050fad1e9bc9081fbe89bb216db7631633d4a741f5ea2e9c322ae9cc0864'
          DOXYGEN_VERSION: '1.18.0'
          DOXYGEN_SHA256: '14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          stage="big-code-analysis-${BCA_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSLo "$stage.tar.gz" "https://github.com/dekobon/big-code-analysis/releases/download/v${BCA_VERSION}/$stage.tar.gz"
          printf '%s  %s\n' "$BCA_SHA256" "$stage.tar.gz" | sha256sum --check --strict -
          tar -xzf "$stage.tar.gz" "$stage/bca"
          echo "$RUNNER_TEMP/$stage" >> "$GITHUB_PATH"
          docs_bin="doxygen-${DOXYGEN_VERSION}/bin"
          docs_tag="Release_${DOXYGEN_VERSION//./_}"
          docs_tar="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -fsSLo "$docs_tar" "https://github.com/doxygen/doxygen/releases/download/$docs_tag/$docs_tar"
          printf '%s  %s\n' "$DOXYGEN_SHA256" "$docs_tar" | sha256sum --check --strict -
          tar -xzf "$docs_tar" "$docs_bin/doxygen"
          echo "$RUNNER_TEMP/$docs_bin" >> "$GITHUB_PATH"
      - name: Read edi's aggregate report
        if: env.COLLECT_METRICS == 'true' && steps.plan.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow edi-measurements.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -n "$run_id" ]]; then
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | select(.name == "edi-measurements" and .expired == false)] | .[0].id // empty')"
            if [[ -n "$artifact_id" ]]; then
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name edi-measurements --dir history
            fi
          fi
      - name: Read pinned crysta aggregate reports
        if: env.COLLECT_METRICS == 'true' && steps.plan.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/crysta_sync.py download --repo "$GITHUB_REPOSITORY"
          --history history/snapshots.json --directory history/crysta
      - name: Collect aggregates for edi and its pinned crysta commits
        if: env.COLLECT_METRICS == 'true' && steps.plan.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: >-
          python3 scripts/collect.py --edi inputs/edi --docs --github
          --history history/snapshots.json --edi-measurements history/edi.json
          --crysta-measurements history/crysta
          --release-catalogue "$RUNNER_TEMP/releases.json" --output history/snapshots.json
      - name: Render dashboard
        if: steps.plan.outputs.refresh == 'true'
        run: |
          set -euo pipefail
          input=data/demo.json
          if [[ "$COLLECT_METRICS" == 'true' ]]; then input=history/snapshots.json; fi
          python3 scripts/render.py --data "$input" --summary "$GITHUB_STEP_SUMMARY"
          python3 scripts/render.py --data "$input" --trends --output dist/trends.html
      - name: Retain aggregates for the next run
        if: env.COLLECT_METRICS == 'true' && steps.plan.outputs.refresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quality-snapshots
          path: history/snapshots.json
          if-no-files-found: error
      - name: Retain the HTML dashboard for review
        if: inputs.collect_only == true
        uses: actions/upload-artifact@v4
        with:
          name: quality-dashboard-report
          path: dist
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: inputs.collect_only != true && steps.plan.outputs.refresh == 'true'
        with:
          path: dist

  archive:
    needs: build
    if: needs.build.outputs.refresh == 'true' && vars.QUALITY_PUBLISH_LIVE == 'true' && inputs.collect_only != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: metrics-history
      - uses: actions/download-artifact@v4
        with:
          name: quality-snapshots
          path: incoming
      - name: Keep normalized snapshots in Git
        run: |
          set -euo pipefail
          cp incoming/snapshots.json snapshots.json
          git add -- snapshots.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Record metrics from run $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/metrics-history

  queue-crysta:
    needs: archive
    if: github.event_name != 'workflow_run' && inputs.sdk_refresh != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: metrics-history
          path: history
          persist-credentials: false
      - name: Queue measurement of new or incomplete SDK pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/crysta_sync.py queue --repo "$GITHUB_REPOSITORY"
          --history history/snapshots.json

  deploy:
    runs-on: ubuntu-24.04
    needs: [build, archive]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.archive.result == 'success' || needs.archive.result == 'skipped') &&
      github.ref == 'refs/heads/main' && inputs.collect_only != true && needs.build.outputs.refresh == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: publish
        uses: actions/deploy-pages@v4
