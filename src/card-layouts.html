<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Enhantica · Code quality</title>
<style>
:root {
  color-scheme:light;
  --font-metric:16px;--font-meta:12px;
  --page:#f5f6f8; --card:#fff; --line:#dee3e9;
  --text:#202936; --muted:#566373;
  --pass:#236b41; --review:#8b560b; --fail:#ad3838; --missing:#667184; --info:#245d9c;
  --verification:#a18bc5; --maintainability:#6f9f9e; --functions:#bd8eae; --size:#8391a5;
}
* {box-sizing:border-box}
body {margin:0;background:var(--page);color:var(--text);font:var(--font-metric)/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main {width:min(100%,1480px);margin:auto;padding:22px clamp(15px,3.5vw,42px) 24px}
a {color:var(--info);text-underline-offset:2px}
a:hover {color:var(--text)}
a:focus-visible {outline:2px solid var(--info);outline-offset:2px}
.grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card {border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:8px;background:var(--card);min-width:0}
.card[data-group="verification"] {--accent:var(--verification)}
.card[data-group="maintainability"] {--accent:var(--maintainability)}
.card[data-group="functions"] {--accent:var(--functions)}
.card[data-group="size"] {--accent:var(--size)}
.card h2 {display:flex;align-items:center;gap:9px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:var(--font-metric);font-weight:600;letter-spacing:-.02em;line-height:1.25;min-height:46px}
.hint {margin-left:auto;font-size:var(--font-meta);color:var(--muted);letter-spacing:0;white-space:nowrap}
.icon {position:relative;display:block;width:22px;height:22px;flex:none;color:var(--muted)}
.icon::before, .icon::after {content:"";position:absolute}
.icon-quality::before {inset:1px;border:2px solid currentColor;border-radius:50%}
.icon-quality::after {width:2px;height:8px;top:4px;left:10px;border-radius:2px;background:currentColor;transform:rotate(35deg);transform-origin:center bottom}
.icon-size::before {inset:1px 3px;border:2px solid currentColor;border-radius:3px}
.icon-size::after {top:6px;left:7px;width:8px;height:2px;border-radius:1px;background:currentColor;box-shadow:0 4px currentColor,0 8px currentColor}
.icon-coverage::before {inset:2px 1px 1px;border:2px solid currentColor;border-radius:3px}
.icon-coverage::after {inset:5px 5px 5px;background:linear-gradient(currentColor,currentColor) left bottom/2px 5px no-repeat,linear-gradient(currentColor,currentColor) center bottom/2px 10px no-repeat,linear-gradient(currentColor,currentColor) right bottom/2px 7px no-repeat}
.readings {padding:9px 14px 11px;display:grid;gap:4px}
.reading, .language-head {display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:7px}
.reading {min-height:28px}
.values, .language-head > div {display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.result, .language-head span {min-width:0;text-align:right;line-height:1.2}
.result {display:flex;align-items:baseline;justify-content:flex-end;gap:3px}
.language-head span {font-size:var(--font-meta);font-weight:550;color:var(--muted)}
.pass {--tone:var(--pass)}
.review {--tone:var(--review)}
.fail {--tone:var(--fail)}
.missing {--tone:var(--missing)}
.measured {--tone:var(--info)}
.value {font-size:var(--font-metric);color:var(--tone,var(--text));font-variant-numeric:tabular-nums;white-space:nowrap}
.mark {width:12px;flex:none;text-align:center;font-size:var(--font-meta);color:var(--tone,var(--muted))}
.counts {min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:var(--font-meta);color:var(--muted);white-space:nowrap}
.counts::before {content:'·';margin-right:4px}
.footer {display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;padding-top:15px;color:var(--muted);font-size:var(--font-meta)}
.legend {display:flex;gap:13px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.legend b {color:var(--tone);margin-right:4px;font-weight:600}
.sr {position:absolute;overflow:hidden;width:1px;height:1px;clip-path:inset(50%);white-space:nowrap}
@media(max-width:990px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card h2,.readings{padding-inline:13px}}
@media(max-width:640px){.grid{grid-template-columns:1fr;gap:12px}main{padding:15px 10px 24px}.readings{padding-inline:11px}}
</style>
</head>
<body>
<main>
  <section class="grid" aria-label="Metric cards for crysta and edi" id="cards"></section>
  <footer class="footer">
    <ul class="legend" aria-label="Result legend">
      <li class="pass"><b aria-hidden="true">✓</b>Within target</li>
      <li class="review"><b aria-hidden="true">!</b>Review</li>
      <li class="fail"><b aria-hidden="true">×</b>Failed</li>
      <li class="measured"><b aria-hidden="true">•</b>Measured</li>
      <li class="missing"><b aria-hidden="true">–</b>No report</li>
    </ul>
    <span id="demo-label" hidden>Demo data</span>
    <a href="trends.html">Trends and components ↗</a>
  </footer>
</main>
<script type="application/json" id="dashboard-data">__DASHBOARD_DATA__</script>
<script>
'use strict';
const data = JSON.parse(document.querySelector('#dashboard-data').textContent);
const projects = ['crysta','edi'];
const labels = {cpp:'C++',python:'Python'};
const languages = Object.keys(labels);
const metricsByLanguage = {cpp:'static',python:'python_static'};
const analysisByLanguage = {cpp:'Clang static analysis',python:'Ruff'};
const coverageByLanguage = {cpp:'coverage',python:'python'};
const docsByLanguage = {cpp:'docs',python:'python_docs'};
const statusSymbols = {pass:'✓',review:'!',fail:'×',missing:'–'};
const statusLabels = {pass:'Within target',review:'Review',fail:'Failed',missing:'No report'};
const format = new Intl.NumberFormat('en', {maximumFractionDigits:1});
const number = value => Number.isFinite(value) ? format.format(value) : '—';
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[character]);
const color = (value, status = 'measured', detail = '', counts = '') => ({
  value:value ?? 'No report', status:value == null ? 'missing' : status, detail, counts,
});
const basic = value => color(Number.isFinite(value) ? number(value) : null);
const reviewLimits = {
  p90: {cpp:12,python:10},
  p90_cognitive: 15,
  p90_length: 50,
  p90_arguments: 5,
  p90_exits: 8,
};
function limitFor(metric, language) {
  const limit = reviewLimits[metric];
  return typeof limit === 'number' ? limit : limit?.[language];
}
function functionMetric(source, key, language) {
  const value = source?.[key];
  if (!Number.isFinite(value)) return color(null);
  const limit = limitFor(key, language);
  return color(number(value),value<=limit?'pass':'review','P90 · advisory reference ≤ '+limit);
}
function maintainability(source) {
  const value = source?.mi;
  if (!Number.isFinite(value)) return color(null);
  return color(number(value),value>=20?'pass':'review','Median file MI · Visual Studio reference, green at 20 or above');
}
function currentSnapshot(project) {
  return data.projects[project].samples.at(-1) ?? {};
}
function averageFunctions(report) {
  return report?.files > 0 && Number.isFinite(report.functions) ? report.functions / report.files : null;
}
function density(project, language, report) {
  const ratio = averageFunctions(report);
  if (ratio == null) return color(null);
  const sourceKey = metricsByLanguage[language];
  const earlier = data.projects[project].samples.slice(0,-1).reverse();
  const previous = earlier.map(sample=>averageFunctions(sample[sourceKey])).find(value=>value!=null);
  const reference = Number.isFinite(previous) ? 'Previous measured ratio: '+number(previous) : 'No previous measured ratio';
  const drift = previous > 0 ? (ratio/previous-1)*100 : null;
  const threshold = 10;
  const flag = drift != null && Number.isFinite(threshold) && drift > threshold;
  return color(number(ratio),flag?'review':'measured',
    number(report.functions)+' functions / '+number(report.files)+' files. '+reference+(drift == null ? '' : '. Change: '+number(drift)+'%.')+(Number.isFinite(threshold) ? ' Review above a '+threshold+'% increase.' : ''),
    number(report.functions)+'/'+number(report.files));
}
function analyzer(sample, language) {
  const tool = analysisByLanguage[language];
  const result = sample.checks?.[tool];
  const detail = sample.checks_scope?.[tool] ? tool+' · '+sample.checks_scope[tool] : tool;
  const statuses = {Clean:'pass',Passed:'pass',Failed:'fail',Partial:'review',Skipped:'missing',Cancelled:'missing'};
  return Object.hasOwn(statuses,result) ? color(result,statuses[result],detail) : color(null,'missing',detail);
}
function coverage(sample, key, scope) {
  const report = sample[key];
  if (!(report?.total > 0)) return color(null,'missing',scope);
  const value = report.covered*100/report.total;
  const target = report.target ?? (data.demo ? data.demoTargets?.coverage?.[key] : null);
  const status = Number.isFinite(target) ? (value>=target ? 'pass' : 'review') : 'measured';
  return color(number(value)+'%',status,
    number(report.covered)+' of '+number(report.total)+' '+scope+
    (Number.isFinite(target) ? '. Target ≥ '+target+'%' : ''));
}
function testCoverage(project, language, sample) {
  const scope = language === 'cpp' ? 'executable C++ lines'
    : project === 'crysta' ? 'public Python API entries' : 'Python package statements';
  return coverage(sample,coverageByLanguage[language],scope);
}
function documentation(language, sample, source) {
  const scope = language === 'cpp' ? 'public header declarations' : 'handwritten Python modules, classes and callables';
  const result = coverage(sample,docsByLanguage[language],scope);
  const lines = source?.documentation_lines;
  if (Number.isFinite(lines)) {
    result.counts = number(lines);
    result.detail += '. '+result.counts+' documentation lines across measured source (BCA)';
  }
  return result;
}
const groups = {
  verification: [
    {icon:'quality',name:'Static checks',hint:'CI status',columns:{cpp:'C++ · clang-tidy',python:'Python · Ruff'},help:'Static analysis results from CI. The C++ check scope varies by project.',read:(project,language,sample)=>analyzer(sample,language)},
    {icon:'coverage',name:'Test coverage',hint:'Unit tier',help:'C++ executable lines. Python measures public API entries in crysta and package statements in edi.',read:testCoverage},
    {icon:'coverage',name:'API documentation',hint:'% · lines',columns:{cpp:'C++ · Doxygen',python:'Python · docstrings'},help:'Percentage of eligible declarations with documentation, followed by documentation lines across measured source.',read:(project,language,sample,source)=>documentation(language,sample,source)},
  ],
  maintainability: [
    {icon:'quality',name:'Maintainability index',hint:'File median',help:'BCA · file median, Visual Studio MI scale (0–100)',read:(project,language,sample,source)=>maintainability(source)},
    {icon:'quality',name:'Cyclomatic complexity',hint:'P90',percentile:'p90',help:'BCA · 90th percentile of function McCabe scores',read:(project,language,sample,source)=>functionMetric(source,'p90',language)},
    {icon:'quality',name:'Cognitive complexity',hint:'P90',percentile:'p90_cognitive',help:'BCA · 90th percentile of function cognitive complexity',read:(project,language,sample,source)=>functionMetric(source,'p90_cognitive',language)},
  ],
  functions: [
    {icon:'size',name:'Function length',hint:'P90 · lines',percentile:'p90_length',help:'BCA · 90th percentile of physical code lines per function',read:(project,language,sample,source)=>functionMetric(source,'p90_length',language)},
    {icon:'size',name:'Function arguments',hint:'P90',percentile:'p90_arguments',help:'BCA · 90th percentile of arguments per callable',read:(project,language,sample,source)=>functionMetric(source,'p90_arguments',language)},
    {icon:'size',name:'Function exits',hint:'P90',percentile:'p90_exits',help:'BCA · 90th percentile of explicit exits per function',read:(project,language,sample,source)=>functionMetric(source,'p90_exits',language)},
  ],
  size: [
    {icon:'size',name:'Physical code lines',hint:'Code only',help:'BCA · physical code lines excluding blank and comment-only lines',read:(project,language,sample,source)=>basic(source?.components?.reduce((sum,item)=>sum+item.lines,0))},
    {icon:'size',name:'Logical lines',hint:'Syntax-based',help:'BCA · logical lines of code',read:(project,language,sample,source)=>basic(source?.logical)},
    {icon:'size',name:'Functions / files',hint:'Ratio · counts',help:'Functions per file, followed by function and file counts. Amber marks a rise of more than 10% from the previous measurement.',read:(project,language,sample,source)=>density(project,language,source)},
  ],
};
function resultCell(result, language) {
  const label = labels[language]+' ';
  const detail = result.detail ? ' title="'+escapeHtml(result.detail)+'"' : '';
  const extra = ['Clean','Passed','Failed','No report'].includes(result.value) ? '' : statusLabels[result.status];
  return '<span class="result '+result.status+'"'+detail+'>'+
    '<span class="sr">'+label+'</span>'+
    (Object.hasOwn(statusSymbols,result.status) && result.value !== 'No report' ? '<span class="mark" aria-hidden="true">'+statusSymbols[result.status]+' </span>' : '')+
    '<span class="value">'+escapeHtml(result.value)+'</span>'+
    (result.counts ? '<span class="counts">'+escapeHtml(result.counts)+'</span>' : '')+
    (extra ? '<span class="sr"> '+extra+'</span>' : '')+'</span>';
}
function cardRow(card, project) {
  const snapshot = currentSnapshot(project);
  const results = languages.map(language=>
    resultCell(card.read(project,language,snapshot,snapshot[metricsByLanguage[language]]),language));
  return '<div class="reading"><span>'+project+'</span><div class="values">'+results.join('')+'</div></div>';
}
function renderCard(group, card) {
  const heads = languages.map(language=>{
    const target = limitFor(card.percentile,language);
    const label = card.columns?.[language] ?? (labels[language]+(Number.isFinite(target) ? ' ≤ '+target : ''));
    return '<span>'+escapeHtml(label)+'</span>';
  }).join('');
  return '<article class="card" data-group="'+group+'" title="'+escapeHtml(card.help)+'"><h2>'+
    '<span class="icon icon-'+card.icon+'" aria-hidden="true"></span>'+card.name+
    '<span class="hint">'+card.hint+'</span></h2><div class="readings">'+
    '<div class="language-head" aria-hidden="true"><div></div><div>'+heads+'</div></div>'+
    projects.map(project=>cardRow(card,project)).join('')+'</div></article>';
}
document.querySelector('#demo-label').hidden = !data.demo;
document.querySelector('#cards').innerHTML = Object.entries(groups)
  .flatMap(([group,cards])=>cards.map(card=>renderCard(group,card))).join('');
</script>
</body>
</html>
