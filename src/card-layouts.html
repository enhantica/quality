<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Enhantica · Code quality</title>
<style>
:root {
  color-scheme:dark;
  --font-title:28px;--font-metric:16px;--font-meta:12px;
  --page:#252525; --card:#1b1b1b; --cap:#202020; --line:#393939;
  --strong:#e0e0e0; --text:#ccc; --muted:#aaa;
  --pass:#89c65b; --review:#f6ab43; --fail:#ef8881; --missing:#999; --info:#8dbce8;
}
* {box-sizing:border-box}
body {margin:0;background:var(--page);color:var(--text);font:var(--font-metric)/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main {width:min(100%,1480px);margin:auto;padding:26px clamp(15px,3.5vw,42px) 24px}
.intro, .scope {display:flex;align-items:center;justify-content:space-between;gap:12px}
.intro {margin-bottom:22px}
h1 {font-size:var(--font-title);line-height:1.1;font-weight:600;letter-spacing:-.036em;margin:0 0 4px;color:var(--strong)}
.context, .scope {font-size:var(--font-meta);color:var(--muted)}
nav {display:flex;gap:2px;border:1px solid #454545;border-radius:6px;padding:3px}
nav a {padding:5px 10px;border-radius:3px;text-decoration:none;white-space:nowrap;color:var(--muted)}
nav a[aria-current=page] {background:#3c3c3c;color:#f3f3f3}
a {color:var(--text)}
a:hover {color:#fff}
a:focus-visible {outline:2px solid var(--review);outline-offset:2px}
.grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card {border:1px solid #151515;border-radius:7px;background:var(--card);min-width:0}
.card h2 {display:flex;align-items:center;gap:10px;margin:0;padding:14px 15px;border-radius:6px 6px 0 0;background:var(--cap);border-bottom:1px solid #151515;font-size:var(--font-metric);font-weight:500;letter-spacing:-.02em;line-height:1.25;min-height:50px}
.hint {margin-left:auto;font-size:var(--font-meta);color:var(--muted);letter-spacing:0;white-space:nowrap}
.icon {position:relative;display:block;width:22px;height:22px;flex:none;color:#c4c4c4}
.icon::before, .icon::after {content:"";position:absolute}
.icon-quality::before {inset:1px;border:2px solid currentColor;border-radius:50%}
.icon-quality::after {width:2px;height:8px;top:4px;left:10px;border-radius:2px;background:currentColor;transform:rotate(35deg);transform-origin:center bottom}
.icon-size::before {inset:1px 3px;border:2px solid currentColor;border-radius:3px}
.icon-size::after {top:6px;left:7px;width:8px;height:2px;border-radius:1px;background:currentColor;box-shadow:0 4px currentColor,0 8px currentColor}
.icon-coverage::before {inset:2px 1px 1px;border:2px solid currentColor;border-radius:3px}
.icon-coverage::after {inset:5px 5px 5px;background:linear-gradient(currentColor,currentColor) left bottom/2px 5px no-repeat,linear-gradient(currentColor,currentColor) center bottom/2px 10px no-repeat,linear-gradient(currentColor,currentColor) right bottom/2px 7px no-repeat}
.readings {padding:12px 15px;display:grid;gap:5px}
.reading, .language-head {display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:center;gap:10px}
.reading {min-height:30px}
.values, .language-head > div {display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.result, .language-head span {min-width:0;text-align:right;line-height:1.2}
.result {display:flex;align-items:baseline;justify-content:flex-end;gap:3px}
.language-head span {font-size:var(--font-meta);font-weight:550;color:var(--muted)}
.pass {--tone:var(--pass)}
.review {--tone:var(--review)}
.fail {--tone:var(--fail)}
.missing {--tone:var(--missing)}
.measured {--tone:var(--info)}
.project {color:var(--tone,var(--text))}
.value {font-size:var(--font-metric);color:var(--tone,var(--strong));font-variant-numeric:tabular-nums;white-space:nowrap}
.mark {width:12px;flex:none;text-align:center;font-size:var(--font-meta);color:var(--tone,var(--muted))}
.counts {min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:var(--font-meta);color:var(--muted);white-space:nowrap}
.counts::before {content:'·';margin-right:4px}
.is-both .reading, .is-both .language-head {grid-template-columns:52px minmax(0,1fr)}
.footer {display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;padding-top:15px;color:var(--muted);font-size:var(--font-meta)}
.legend {display:flex;gap:13px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.legend b {color:var(--tone);margin-right:4px;font-weight:600}
.sr {position:absolute;overflow:hidden;width:1px;height:1px;clip-path:inset(50%);white-space:nowrap}
@media(max-width:990px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card h2,.readings{padding-inline:13px}}
@media(max-width:610px){.intro{align-items:flex-start;flex-direction:column;gap:12px}.grid{grid-template-columns:1fr;gap:12px}main{padding-top:18px}.card h2{min-height:auto}}
</style>
</head>
<body>
<main>
  <header class="intro">
    <div><h1>Code quality</h1><div class="context" id="context"></div></div>
    <div class="scope"><span>Source metrics</span><nav aria-label="Source metric language">
      <a href="#cpp">C++</a><a href="#python">Python</a><a href="#both">Both</a>
    </nav></div>
  </header>
  <section class="grid" aria-label="Metric cards for crysta and edi" id="cards"></section>
  <footer class="footer">
    <ul class="legend" aria-label="Result legend">
      <li class="pass"><b aria-hidden="true">✓</b>Within target</li>
      <li class="review"><b aria-hidden="true">!</b>Review</li>
      <li class="fail"><b aria-hidden="true">×</b>Failed</li>
      <li class="measured"><b aria-hidden="true">•</b>Measured</li>
      <li class="missing"><b aria-hidden="true">–</b>No report</li>
    </ul>
    <a href="trends.html">Trends and components ↗</a>
  </footer>
</main>
<script type="application/json" id="dashboard-data">__DASHBOARD_DATA__</script>
<script>
'use strict';
const data = JSON.parse(document.querySelector('#dashboard-data').textContent);
const projects = ['crysta','edi'];
const labels = {cpp:'C++',python:'Python'};
const metricsByLanguage = {cpp:'static',python:'python_static'};
const analysisByLanguage = {cpp:'Clang static analysis',python:'Ruff'};
const statusSymbols = {pass:'✓',review:'!',fail:'×',missing:'–'};
const statusLabels = {pass:'Within target',review:'Review',fail:'Failed',missing:'No report'};
const format = new Intl.NumberFormat('en', {maximumFractionDigits:1});
const number = value => Number.isFinite(value) ? format.format(value) : '—';
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[character]);
const color = (value, status = 'measured', detail = '', counts = '') => ({
  value:value ?? 'No report', status:value == null ? 'missing' : status, detail, counts,
});
const basic = value => color(Number.isFinite(value) ? number(value) : null);
const reviewLimits = {
  p90: {cpp:12,python:10},
  p90_cognitive: 15,
  p90_length: 50,
  p90_arguments: 5,
  p90_exits: 8,
};
function limitFor(metric, language) {
  const limit = reviewLimits[metric];
  return typeof limit === 'number' ? limit : limit?.[language];
}
function functionMetric(source, key, language) {
  const value = source?.[key];
  if (!Number.isFinite(value)) return color(null);
  const limit = limitFor(key, language);
  return color(number(value),value<=limit?'pass':'review','P90 · advisory reference ≤ '+limit);
}
function maintainability(source) {
  const value = source?.mi;
  if (!Number.isFinite(value)) return color(null);
  return color(number(value),value>=20?'pass':'review','Median file MI · Visual Studio reference, green at 20 or above');
}
function currentSnapshot(project) {
  return data.projects[project].samples.at(-1) ?? {};
}
function averageFunctions(report) {
  return report?.files > 0 && Number.isFinite(report.functions) ? report.functions / report.files : null;
}
function density(project, language, report) {
  const ratio = averageFunctions(report);
  if (ratio == null) return color(null);
  const sourceKey = metricsByLanguage[language];
  const earlier = data.projects[project].samples.slice(0,-1).reverse();
  const previous = earlier.map(sample=>averageFunctions(sample[sourceKey])).find(value=>value!=null);
  const reference = Number.isFinite(previous) ? 'Previous measured ratio: '+number(previous) : 'No previous measured ratio';
  const drift = previous > 0 ? (ratio/previous-1)*100 : null;
  const threshold = 10;
  const flag = drift != null && Number.isFinite(threshold) && drift > threshold;
  return color(number(ratio),flag?'review':'measured',
    number(report.functions)+' functions / '+number(report.files)+' files. '+reference+(drift == null ? '' : '. Change: '+number(drift)+'%.')+(Number.isFinite(threshold) ? ' Review above a '+threshold+'% increase.' : ''),
    number(report.functions)+'/'+number(report.files));
}
function analyzer(sample, language) {
  const tool = analysisByLanguage[language];
  const result = sample.checks?.[tool];
  const detail = sample.checks_scope?.[tool] ? tool+' · '+sample.checks_scope[tool] : tool;
  const statuses = {Clean:'pass',Passed:'pass',Failed:'fail',Partial:'review',Skipped:'missing',Cancelled:'missing'};
  return Object.hasOwn(statuses,result) ? color(result,statuses[result],detail) : color(null,'missing',detail);
}
function coverage(sample, key) {
  const report = sample[key];
  if (!(report?.total > 0)) return color(null);
  const value = report.covered*100/report.total;
  const target = report.target ?? (data.demo ? data.demoTargets?.coverage?.[key] : null);
  const status = Number.isFinite(target) ? (value>=target ? 'pass' : 'review') : 'measured';
  return color(number(value)+'%',status,
    number(report.covered)+' of '+number(report.total)+(Number.isFinite(target) ? '. Target ≥ '+target+'%' : ''));
}
const cards = [
  {icon:'quality',name:'Code quality',help:'Clang static analysis for C++; Ruff for Python',read:(project,language,sample)=>analyzer(sample,language)},
  {icon:'quality',name:'Maintainability index',hint:'File median',help:'BCA · file median, Visual Studio MI scale (0–100)',read:(project,language,sample,source)=>maintainability(source)},
  {icon:'quality',name:'Cyclomatic complexity',percentile:'p90',help:'BCA · 90th percentile of function McCabe scores',read:(project,language,sample,source)=>functionMetric(source,'p90',language)},
  {icon:'size',name:'Physical code lines',help:'BCA · physical code lines excluding blank and comment-only lines',read:(project,language,sample,source)=>basic(source?.components?.reduce((sum,item)=>sum+item.lines,0))},
  {icon:'size',name:'Logical lines',help:'BCA · logical lines of code',read:(project,language,sample,source)=>basic(source?.logical)},
  {icon:'size',name:'Functions / files',help:'Functions per file, with the function and file counts beside it. Amber marks a rise of more than 10% from the previous measured ratio.',read:(project,language,sample,source)=>density(project,language,source)},
  {icon:'coverage',name:'C++ unit-test coverage',help:'LLVM · instrumented C++ unit tiers',fixed:'coverage'},
  {icon:'coverage',name:'Python test coverage',help:'crysta public API entries · edi statements in lib/edi',fixed:'python'},
  {icon:'coverage',name:'C++ API documentation',help:'Doxygen · documented public header symbols',fixed:'docs'},
  {icon:'quality',name:'Cognitive complexity',percentile:'p90_cognitive',help:'BCA · 90th percentile of function cognitive complexity',read:(project,language,sample,source)=>functionMetric(source,'p90_cognitive',language)},
  {icon:'size',name:'Function length',percentile:'p90_length',help:'BCA · 90th percentile of physical code lines per function',read:(project,language,sample,source)=>functionMetric(source,'p90_length',language)},
  {icon:'size',name:'Function arguments',percentile:'p90_arguments',help:'BCA · 90th percentile of arguments per callable as counted by BCA',read:(project,language,sample,source)=>functionMetric(source,'p90_arguments',language)},
  {icon:'size',name:'Function exits',percentile:'p90_exits',help:'BCA · 90th percentile of explicit exits per function',read:(project,language,sample,source)=>functionMetric(source,'p90_exits',language)},
  {icon:'coverage',name:'Documentation lines',help:'BCA · total lines in documentation comments and docstrings',read:(project,language,sample,source)=>basic(source?.documentation_lines)},
];
function resultCell(result, language) {
  const label = language ? labels[language]+' ' : '';
  const detail = result.detail ? ' title="'+escapeHtml(result.detail)+'"' : '';
  const extra = ['Clean','Passed','Failed','No report'].includes(result.value) ? '' : statusLabels[result.status];
  return '<span class="result '+result.status+'"'+detail+'>'+
    '<span class="sr">'+label+'</span>'+
    (Object.hasOwn(statusSymbols,result.status) && result.value !== 'No report' ? '<span class="mark" aria-hidden="true">'+statusSymbols[result.status]+' </span>' : '')+
    '<span class="value">'+escapeHtml(result.value)+'</span>'+
    (result.counts ? '<span class="counts">'+escapeHtml(result.counts)+'</span>' : '')+
    (extra ? '<span class="sr"> '+extra+'</span>' : '')+'</span>';
}
function cardRow(card, project, languages) {
  const snapshot = currentSnapshot(project);
  const results = card.fixed
    ? [coverage(snapshot,card.fixed)]
    : languages.map(language=>card.read(project,language,snapshot,snapshot[metricsByLanguage[language]]));
  const multiple = results.length>1;
  const tone = multiple ? 'neutral' : results[0].status;
  return '<div class="reading"><span class="project '+tone+'">'+project+'</span><div class="values">'+
    results.map((result,index)=>resultCell(result,multiple?languages[index]:null)).join('')+'</div></div>';
}
function render() {
  const requested = location.hash.slice(1);
  const active = requested==='both' || requested==='python' ? requested : 'cpp';
  const languages = active==='both' ? ['cpp','python'] : [active];
  for (const link of document.querySelectorAll('nav a')) {
    if (link.hash === '#'+active) link.setAttribute('aria-current','page');
    else link.removeAttribute('aria-current');
  }
  document.querySelector('#context').textContent = 'crysta + edi · main'+(data.demo?' · Demo data':'');
  document.querySelector('#cards').innerHTML = cards.map(card=>{
    const both = !card.fixed && languages.length>1;
    const columnLabel = language => {
      const target = limitFor(card.percentile, language);
      return labels[language]+(Number.isFinite(target) ? ' ≤ '+target : '');
    };
    const heads = both ? '<div class="language-head" aria-hidden="true"><div></div><div>'+
      languages.map(language=>'<span>'+columnLabel(language)+'</span>').join('')+'</div></div>' : '';
    const target = both ? null : limitFor(card.percentile,active);
    const caption = card.percentile ? 'P90'+(Number.isFinite(target) ? ' ≤ '+target : '') : card.hint;
    const hint = caption ? '<span class="hint">'+caption+'</span>' : '';
    return '<article class="card'+(both?' is-both':'')+'" title="'+escapeHtml(card.help)+'"><h2>'+
      '<span class="icon icon-'+card.icon+'" aria-hidden="true"></span>'+card.name+hint+'</h2>'+
      '<div class="readings">'+heads+projects.map(project=>cardRow(card,project,languages)).join('')+'</div></article>';
  }).join('');
}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
