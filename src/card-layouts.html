<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Enhantica · Code quality</title>
<style>
:root {
  color-scheme:dark;
  --page:#252525; --card:#1b1b1b; --cap:#202020; --line:#393939;
  --strong:#e0e0e0; --text:#ccc; --muted:#aaa;
  --pass:#89c65b; --review:#f6ab43; --fail:#ef8881; --missing:#999;
}
* {box-sizing:border-box}
body {margin:0;background:var(--page);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main {width:min(100%,1480px);margin:auto;padding:26px clamp(15px,3.5vw,42px) 24px}
.intro, .scope {display:flex;align-items:center;justify-content:space-between;gap:12px}
.intro {margin-bottom:22px}
h1 {font-size:clamp(24px,3vw,32px);line-height:1.1;font-weight:600;letter-spacing:-.036em;margin:0 0 4px;color:var(--strong)}
.context, .scope {font-size:13px;color:var(--muted)}
nav {display:flex;gap:2px;border:1px solid #454545;border-radius:6px;padding:3px}
nav a {padding:5px 10px;border-radius:3px;text-decoration:none;white-space:nowrap;color:var(--muted)}
nav a[aria-current=page] {background:#3c3c3c;color:#f3f3f3}
a {color:var(--text)}
a:hover {color:#fff}
a:focus-visible {outline:2px solid var(--review);outline-offset:2px}
.grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card {border:1px solid #151515;border-radius:7px;background:var(--card);min-width:0}
.card h2 {display:flex;align-items:center;gap:10px;margin:0;padding:14px 17px;border-radius:6px 6px 0 0;background:var(--cap);border-bottom:1px solid #151515;font-size:clamp(15px,1.5vw,18px);font-weight:500;letter-spacing:-.02em;line-height:1.25;min-height:50px}
.hint {margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:0;white-space:nowrap}
.icon {display:inline-grid;place-items:center;width:16px;flex:none;color:#bbb;font-size:16px;font-weight:600}
.readings {padding:12px 17px;display:grid;gap:5px}
.reading, .language-head {display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:center;gap:10px}
.reading {min-height:30px}
.values, .language-head > div {display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.result, .language-head span {min-width:0;text-align:right;line-height:1.2}
.language-head span {font-size:11px;font-weight:550;color:var(--muted)}
.pass {--tone:var(--pass)}
.review {--tone:var(--review)}
.fail {--tone:var(--fail)}
.missing {--tone:var(--missing)}
.project {display:flex;align-items:center;gap:7px;color:var(--tone,var(--text))}
.value {font-size:clamp(15px,1.6vw,20px);color:var(--tone,var(--strong));font-variant-numeric:tabular-nums;white-space:nowrap}
.mark {width:14px;flex:none;text-align:center;font-size:13px;color:var(--tone,var(--muted))}
.counts {margin-left:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.is-both .reading, .is-both .language-head {grid-template-columns:62px minmax(0,1fr)}
.is-both .counts {display:block;margin:2px 0 1px;font-size:10px}
.is-both .value {font-size:clamp(13px,1.35vw,17px)}
.footer {display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;padding-top:15px;color:var(--muted);font-size:12px}
.legend {display:flex;gap:13px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.legend b {color:var(--tone);margin-right:4px;font-weight:600}
.sr {position:absolute;overflow:hidden;width:1px;height:1px;clip-path:inset(50%);white-space:nowrap}
@media(max-width:990px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card h2,.readings{padding-inline:13px}}
@media(max-width:610px){.intro{align-items:flex-start;flex-direction:column;gap:12px}.grid{grid-template-columns:1fr;gap:12px}main{padding-top:18px}.card h2{min-height:auto}.value,.is-both .value{font-size:17px}}
</style>
</head>
<body>
<main>
  <header class="intro">
    <div><h1>Code quality</h1><div class="context" id="context"></div></div>
    <div class="scope"><span>Source metrics</span><nav aria-label="Source metric language">
      <a href="#cpp">C++</a><a href="#python">Python</a><a href="#both">Both</a>
    </nav></div>
  </header>
  <section class="grid" aria-label="Metric cards for crysta and edi" id="cards"></section>
  <footer class="footer">
    <ul class="legend" aria-label="Result legend">
      <li class="pass"><b aria-hidden="true">✓</b>Within target</li>
      <li class="review"><b aria-hidden="true">!</b>Review</li>
      <li class="fail"><b aria-hidden="true">×</b>Failed</li>
      <li class="missing"><b aria-hidden="true">–</b>No report</li>
    </ul>
    <a href="trends.html">Trends and components ↗</a>
  </footer>
</main>
<script type="application/json" id="dashboard-data">__DASHBOARD_DATA__</script>
<script>
'use strict';
const data = JSON.parse(document.querySelector('#dashboard-data').textContent);
const projects = ['crysta','edi'];
const labels = {cpp:'C++',python:'Python'};
const metricsByLanguage = {cpp:'static',python:'python_static'};
const analysisByLanguage = {cpp:'Clang static analysis',python:'Ruff'};
const statusSymbols = {pass:'✓',review:'!',fail:'×',missing:'–',neutral:'·'};
const statusLabels = {pass:'Within target',review:'Review',fail:'Failed',missing:'No report'};
const format = new Intl.NumberFormat('en', {maximumFractionDigits:1});
const number = value => Number.isFinite(value) ? format.format(value) : '—';
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[character]);
const color = (value, status = 'neutral', detail = '', counts = '') => ({
  value:value ?? '—', status:value == null ? 'missing' : status, detail, counts,
});
const basic = value => color(Number.isFinite(value) ? number(value) : null);
function currentSnapshot(project) {
  return data.projects[project].samples.at(-1) ?? {};
}
function averageFunctions(report) {
  return report?.files > 0 && Number.isFinite(report.functions) ? report.functions / report.files : null;
}
function density(project, language, report) {
  const ratio = averageFunctions(report);
  if (ratio == null) return color(null);
  const sourceKey = metricsByLanguage[language];
  const earlier = data.projects[project].samples.slice(0,-1).reverse();
  const previous = earlier.map(sample=>averageFunctions(sample[sourceKey])).find(value=>value!=null);
  const reference = Number.isFinite(previous) ? 'Previous measured ratio: '+number(previous) : 'No previous measured ratio';
  const drift = previous > 0 ? (ratio/previous-1)*100 : null;
  const threshold = data.demo ? data.demoTargets?.densityIncrease : data.densityReviewIncrease;
  const flag = drift != null && Number.isFinite(threshold) && drift > threshold;
  return color(number(ratio),flag?'review':'neutral',
    'Functions per file. '+reference+(drift == null ? '' : '. Change: '+number(drift)+'%.')+(Number.isFinite(threshold) ? ' Review above a '+threshold+'% increase.' : ''),
    '('+number(report.functions)+' / '+number(report.files)+')');
}
function complexityTarget(language) {
  return data.demo ? data.demoTargets?.complexity?.[language] : data.complexityTargets?.[language];
}
function complexity(language, report) {
  const score = report?.p90;
  if (!Number.isFinite(score)) return color(null);
  const target = complexityTarget(language);
  return Number.isFinite(target)
    ? color(number(score),score<=target?'pass':'review','90th percentile McCabe. Target ≤ '+target)
    : color(number(score),'neutral','90th percentile McCabe. No target configured.');
}
function analyzer(sample, language) {
  const tool = analysisByLanguage[language];
  const result = sample.checks?.[tool];
  const statuses = {Clean:'pass',Passed:'pass',Failed:'fail',Partial:'review',Skipped:'missing'};
  return Object.hasOwn(statuses,result) ? color(result,statuses[result],tool) : color(null,'missing',tool);
}
function coverage(sample, key) {
  const report = sample[key];
  if (!(report?.total > 0)) return color(null);
  const value = report.covered*100/report.total;
  const target = report.target ?? (data.demo ? data.demoTargets?.coverage?.[key] : null);
  const status = Number.isFinite(target) ? (value>=target ? 'pass' : 'review') : 'neutral';
  return color(number(value)+'%',status,
    number(report.covered)+' of '+number(report.total)+(Number.isFinite(target) ? '. Target ≥ '+target+'%' : ''));
}
const cards = [
  {icon:'◉',name:'Code quality',help:'Clang static analysis for C++; Ruff for Python',read:(project,language,sample)=>analyzer(sample,language)},
  {icon:'◑',name:'Maintainability index',help:'BCA · median file Visual Studio MI',read:(project,language,sample,source)=>basic(source?.mi)},
  {icon:'⌁',name:'Cyclomatic complexity',complexity:true,help:'BCA · 90th percentile of function McCabe scores',read:(project,language,sample,source)=>complexity(language,source)},
  {icon:'≡',name:'Physical code lines',help:'BCA · physical code lines excluding blank and comment-only lines',read:(project,language,sample,source)=>basic(source?.components?.reduce((sum,item)=>sum+item.lines,0))},
  {icon:'§',name:'Logical lines',help:'BCA · logical lines of code',read:(project,language,sample,source)=>basic(source?.logical)},
  {icon:'▤',name:'Functions / files',help:'Functions per file, with function and file counts in parentheses. Amber marks a rise of more than 10% from the previous measured ratio in this demo.',read:(project,language,sample,source)=>density(project,language,source)},
  {icon:'▥',name:'C++ unit-test coverage',help:'LLVM · instrumented C++ unit tiers',fixed:'coverage'},
  {icon:'▥',name:'Python test coverage',help:'crysta public API entries · edi statements in lib/edi',fixed:'python'},
  {icon:'¶',name:'C++ API documentation',help:'Doxygen · documented public header symbols',fixed:'docs'},
];
function resultCell(result, language) {
  const label = language ? labels[language]+' ' : '';
  const detail = result.detail ? ' title="'+escapeHtml(result.detail)+'"' : '';
  const extra = ['Clean','Passed','Failed'].includes(result.value) ? '' : statusLabels[result.status];
  return '<span class="result '+result.status+'"'+detail+'>'+
    '<span class="sr">'+label+'</span>'+
    (language && result.status !== 'neutral' ? '<span class="mark" aria-hidden="true">'+statusSymbols[result.status]+' </span>' : '')+
    '<span class="value">'+escapeHtml(result.value)+'</span>'+
    (result.counts ? '<span class="counts">'+escapeHtml(result.counts)+'</span>' : '')+
    (extra ? '<span class="sr"> '+extra+'</span>' : '')+'</span>';
}
function cardRow(card, project, languages) {
  const snapshot = currentSnapshot(project);
  const results = card.fixed
    ? [coverage(snapshot,card.fixed)]
    : languages.map(language=>card.read(project,language,snapshot,snapshot[metricsByLanguage[language]]));
  const multiple = results.length>1;
  const tone = multiple ? 'neutral' : results[0].status;
  return '<div class="reading"><span class="project '+tone+'"><span class="mark" aria-hidden="true">'+
    (multiple?'':statusSymbols[tone])+'</span>'+project+'</span><div class="values">'+
    results.map((result,index)=>resultCell(result,multiple?languages[index]:null)).join('')+'</div></div>';
}
function render() {
  const requested = location.hash.slice(1);
  const active = requested==='both' || requested==='python' ? requested : 'cpp';
  const languages = active==='both' ? ['cpp','python'] : [active];
  for (const link of document.querySelectorAll('nav a')) {
    if (link.hash === '#'+active) link.setAttribute('aria-current','page');
    else link.removeAttribute('aria-current');
  }
  document.querySelector('#context').textContent = 'crysta + edi · main'+(data.demo?' · Demo data':'');
  document.querySelector('#cards').innerHTML = cards.map(card=>{
    const both = !card.fixed && languages.length>1;
    const columnLabel = language => {
      const target = card.complexity ? complexityTarget(language) : null;
      return labels[language]+(Number.isFinite(target) ? ' ≤ '+target : '');
    };
    const heads = both ? '<div class="language-head" aria-hidden="true"><div></div><div>'+
      languages.map(language=>'<span>'+columnLabel(language)+'</span>').join('')+'</div></div>' : '';
    const target = card.complexity && !both ? complexityTarget(active) : null;
    const hint = card.complexity ? '<span class="hint">P90'+(Number.isFinite(target) ? ' ≤ '+target : '')+'</span>' : '';
    return '<article class="card'+(both?' is-both':'')+'" title="'+escapeHtml(card.help)+'"><h2>'+
      '<span class="icon" aria-hidden="true">'+card.icon+'</span>'+card.name+hint+'</h2>'+
      '<div class="readings">'+heads+projects.map(project=>cardRow(card,project,languages)).join('')+'</div></article>';
  }).join('');
}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
