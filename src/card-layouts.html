<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Enhantica · Code quality</title>
<style>
:root {
  color-scheme:light;
  --font-metric:16px;--font-meta:12px;
  --page:#f5f6f8; --card:#fff; --line:#dee3e9;
  --text:#202936; --muted:#566373;
  --pass:#236b41; --review:#8b560b; --fail:#ad3838; --missing:#667184; --info:#245d9c;
  --verification:#a18bc5; --maintainability:#6f9f9e; --functions:#bd8eae; --size:#8391a5;
}
* {box-sizing:border-box}
body {margin:0;background:var(--page);color:var(--text);font:var(--font-metric)/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main {width:min(100%,1480px);margin:auto;padding:22px clamp(15px,3.5vw,42px) 24px}
a {color:var(--info);text-underline-offset:2px}
a:hover {color:var(--text)}
a:focus-visible {outline:2px solid var(--info);outline-offset:2px}
.grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card {border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:8px;background:var(--card);min-width:0}
.card[data-group="verification"] {--accent:var(--verification)}
.card[data-group="maintainability"] {--accent:var(--maintainability)}
.card[data-group="functions"] {--accent:var(--functions)}
.card[data-group="size"] {--accent:var(--size)}
.card h2 {margin:0;border-bottom:1px solid var(--line);font-size:var(--font-metric);font-weight:600;letter-spacing:-.02em;line-height:1.25}
.info-trigger {border:0;background:none;color:inherit;font:inherit;cursor:help;padding:0}
.info-trigger:focus-visible {outline:2px solid var(--info);outline-offset:2px;border-radius:3px}
.card-info {display:flex;align-items:center;gap:9px;width:100%;padding:12px 14px;min-height:46px;text-align:left;letter-spacing:inherit}
.hint {margin-left:auto;font-size:var(--font-meta);color:var(--muted);letter-spacing:0;white-space:nowrap}
.help-mark {display:grid;place-items:center;width:13px;height:13px;border:1px solid currentColor;border-radius:50%;flex:none;font-size:var(--font-meta);line-height:1;color:var(--muted)}
.icon {position:relative;display:block;width:22px;height:22px;flex:none;color:var(--muted)}
.icon::before, .icon::after {content:"";position:absolute}
.icon-verification::before, .icon-maintainability::before {inset:1px;border:2px solid currentColor;border-radius:50%}
.icon-verification::after {width:8px;height:4px;top:7px;left:6px;border:solid currentColor;border-width:0 0 2px 2px;transform:rotate(-45deg)}
.icon-maintainability::after {width:2px;height:8px;top:4px;left:10px;border-radius:2px;background:currentColor;transform:rotate(35deg);transform-origin:center bottom}
.icon-functions::before {content:"{}";inset:0;display:grid;place-items:center;font:600 var(--font-metric)/1 ui-monospace,monospace;white-space:nowrap}
.icon-size::before {inset:1px 3px;border:2px solid currentColor;border-radius:3px}
.icon-size::after {top:6px;left:7px;width:8px;height:2px;border-radius:1px;background:currentColor;box-shadow:0 4px currentColor,0 8px currentColor}
.readings {padding:9px 14px 11px;display:grid;gap:4px}
.reading, .language-head {display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:7px}
.reading {min-height:28px}
.values, .language-head > div {display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.result, .language-head span {min-width:0;text-align:right;line-height:1.2}
.result {display:flex;align-items:baseline;justify-content:flex-end;gap:3px;line-height:1.2}
.result:hover .value {text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.language-head span {font-size:var(--font-meta);font-weight:550;color:var(--muted)}
.pass {--tone:var(--pass)}
.review {--tone:var(--review)}
.fail {--tone:var(--fail)}
.missing {--tone:var(--missing)}
.measured {--tone:var(--info)}
.value {font-size:var(--font-metric);color:var(--tone,var(--text));font-variant-numeric:tabular-nums;white-space:nowrap}
.mark {min-width:8px;flex:none;text-align:center;font-size:var(--font-meta);color:var(--tone,var(--muted))}
.counts {min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:var(--font-meta);color:var(--info);font-variant-numeric:tabular-nums;white-space:nowrap}
.counts::before {content:'·';margin-right:4px;color:var(--muted)}
.footer {display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;padding-top:15px;color:var(--muted);font-size:var(--font-meta)}
.legend {display:flex;gap:13px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.legend b {color:var(--tone);margin-right:4px;font-weight:600}
.sr {position:absolute;overflow:hidden;width:1px;height:1px;clip-path:inset(50%);white-space:nowrap}
.metric-tooltip {position:fixed;z-index:2;width:min(340px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);box-shadow:0 8px 26px #20293629;color:var(--muted);font-size:var(--font-meta);line-height:1.45}
.metric-tooltip strong {display:block;color:var(--text);font-size:var(--font-metric)}
.metric-tooltip p {margin:4px 0 8px}
.range-label {display:block;margin-top:9px;color:var(--text);font-weight:600}
.range-label a {text-decoration-thickness:1px}
.range-list {display:grid;grid-template-columns:7px max-content minmax(0,1fr);column-gap:6px;margin:4px 0 0;padding:0;list-style:none}
.range-list li {display:grid;grid-column:1/-1;grid-template-columns:subgrid;align-items:baseline;padding:2px 0}
.range-list li::before {content:'';width:6px;height:6px;margin-top:.46em;align-self:start;border-radius:50%;background:var(--tone)}
.range-list b {color:var(--tone);font-weight:600}
@media(max-width:990px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card-info,.readings{padding-inline:13px}}
@media(max-width:640px){.grid{grid-template-columns:1fr;gap:12px}main{padding:15px 10px 24px}.readings{padding-inline:11px}.reading,.language-head{grid-template-columns:44px minmax(0,1fr);gap:5px}.values,.language-head > div{gap:6px}}
</style>
</head>
<body>
<main>
  <section class="grid" aria-label="Metric cards for crysta and edi" id="cards"></section>
  <footer class="footer">
    <ul class="legend" aria-label="Result legend">
      <li class="pass"><b aria-hidden="true">✓</b>Within reference</li>
      <li class="review"><b aria-hidden="true">!</b>Review</li>
      <li class="fail"><b aria-hidden="true">×</b>Needs attention</li>
      <li class="measured"><b aria-hidden="true">•</b>Measured</li>
      <li class="missing"><b aria-hidden="true">–</b>No report</li>
    </ul>
    <span id="demo-label" hidden>Demo data</span>
    <a href="trends.html">Trends and components ↗</a>
  </footer>
</main>
<div class="metric-tooltip" id="metric-tooltip" role="region" aria-labelledby="metric-tooltip-title" hidden></div>
<script type="application/json" id="dashboard-data">__DASHBOARD_DATA__</script>
<script>
'use strict';
const data = JSON.parse(document.querySelector('#dashboard-data').textContent);
const projects = ['crysta','edi'];
const labels = {cpp:'C++',python:'Python'};
const languages = Object.keys(labels);
const metricsByLanguage = {cpp:'static',python:'python_static'};
const analysisByLanguage = {cpp:'Clang static analysis',python:'Ruff'};
const coverageByLanguage = {cpp:'coverage',python:'python'};
const docsByLanguage = {cpp:'docs',python:'python_docs'};
const statusSymbols = {pass:'✓',review:'!',fail:'×'};
const statusLabels = {pass:'Within reference',review:'Review',fail:'Needs attention',missing:'No report'};
const format = new Intl.NumberFormat('en', {maximumFractionDigits:1});
const number = value => format.format(value);
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[character]);

const band = (tone, range, note) => ({tone, range, note});
const reference = (label, href) => ({label,href});
const bcaDefaults = 'https://github.com/dekobon/big-code-analysis/blob/v2.6.0/big-code-analysis-cli/src/default_thresholds.rs';
const dashboardPolicy = 'https://github.com/enhantica/quality/blob/main/README.md';
const rangeSources = {
  visualStudio:reference('Tool reference · Visual Studio','https://learn.microsoft.com/en-us/visualstudio/code-quality/code-metrics-maintainability-index-range-and-meaning#in-this-article'),
  sonar:reference('Tool reference · SonarSource S3776','https://community.sonarsource.com/t/cognitive-complexity-for-python-vs-c/45303/2'),
  bcaArguments:reference('Tool reference · BCA 2.6.0 defaults',bcaDefaults+'#L85-L86'),
  bcaExits:reference('Tool reference · BCA 2.6.0 defaults',bcaDefaults+'#L95-L96'),
  nist:reference('Published guideline · NIST SP 500-235 §2.5','https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication500-235.pdf#page=35'),
  documentation:reference('Dashboard policy',dashboardPolicy+'#api-documentation'),
  length:reference('Dashboard policy',dashboardPolicy+'#function-length'),
  density:reference('Dashboard policy',dashboardPolicy+'#functions-per-file'),
};
const measured = {
  source:reference('BCA measurement · no cutoff','https://dekobon.github.io/big-code-analysis/metrics.html#lines-of-code'),
  bands:[band('measured','Measured count','Size or volume. No target applies.')],
  grade:()=> 'measured',
};
const checks = {
  bands:[
    band('pass','Passed','The selected analysis completed successfully.'),
    band('review','Partial','Only part of the selected analysis completed.'),
    band('fail','Failed','The selected check reported a failure.'),
    band('missing','Unavailable','No result, skipped, or cancelled.'),
  ],
};
function atLeast(green, amber, unit, source, notes) {
  const target = '≥ '+number(green)+unit;
  const bands = [band('pass',target,notes.pass)];
  if (amber != null) bands.push(band('review',number(amber)+unit+' to < '+number(green)+unit,notes.review));
  bands.push(band('fail','< '+number(amber ?? green)+unit,notes.fail));
  return {target, source, bands, grade:value=>value>=green ? 'pass' : amber!=null && value>=amber ? 'review' : 'fail'};
}
function atMost(limit, unit, source, notes) {
  const target = '≤ '+number(limit)+unit;
  return {
    target,
    source,
    bands:[band('pass',target,notes.pass),band('review','> '+number(limit)+unit,notes.review)],
    grade:value=>value<=limit ? 'pass' : 'review',
  };
}
const maintainability = atLeast(20,10,'',rangeSources.visualStudio,{
  pass:'Good on the Visual Studio scale.',
  review:'Moderate maintainability.',
  fail:'Low maintainability.',
});
const documentation = atLeast(80,50,'%',rangeSources.documentation,{
  pass:'Meets the dashboard’s documentation reference.',
  review:'Coverage has room to improve.',
  fail:'Fewer than half of eligible items are documented.',
});
const documentationLines = band('measured','Lines after ·','BCA count across the measured source. No target applies.');
documentation.bands.push(documentationLines);
const densityChange = atMost(10,'%',rangeSources.density,{
  pass:'Increase is within the advisory limit.',
  review:'Functions per file rose by more than 10%.',
});
const densityReference = {
  ...densityChange,
  bands:[
    ...densityChange.bands,
    band('measured','No baseline','A prior positive ratio is needed to compute change.'),
    band('measured','Counts after ·','Functions / files. No target applies to the counts.'),
  ],
};
const unratedCoverage = {
  source:reference('Coverage report · no declared CI target'),
  bands:[band('measured','Measured coverage','This report has no declared CI target.')],
  grade:()=> 'measured',
};

function reading(value, rule, detail = '', unit = '') {
  if (!Number.isFinite(value)) return {value:'No report',status:'missing',rule,detail};
  const status = rule.grade(value);
  const formatted = rule.grade(Number(value.toFixed(1))) === status ? number(value) : String(value);
  return {value:formatted+unit,status,rule,detail};
}
function analyzer(sample, language) {
  const tool = analysisByLanguage[language];
  const value = sample.checks?.[tool] ?? 'No report';
  const detail = sample.checks_scope?.[tool] ? tool+' · '+sample.checks_scope[tool] : tool;
  const statuses = {Clean:'pass',Passed:'pass',Failed:'fail',Partial:'review',Skipped:'missing',Cancelled:'missing'};
  const run = sample.checks_url ?? sample.ci_url;
  const runHref = /^https:\/\/github\.com\/enhantica\/(?:crysta|edi|quality)\/actions\/runs\/\d+$/.test(run) ? run : null;
  const source = reference('Project CI · clang-tidy and Ruff results',runHref);
  return {value,status:statuses[value] ?? 'missing',rule:{...checks,source},detail};
}
function functionMetric(key, limit, reference) {
  const rules = Object.fromEntries(languages.map(language=>[language,atMost(
    typeof limit === 'number' ? limit : limit[language], '', reference, {
      pass:'P90 is within the reference.',
      review:'P90 exceeds the reference.',
    },
  )]));
  return (_project,language,_sample,source)=>reading(source?.[key],rules[language]);
}
function averageFunctions(report) {
  return report?.files > 0 && Number.isFinite(report.functions) ? report.functions / report.files : null;
}
function density(project, language, report) {
  const ratio = averageFunctions(report);
  if (ratio == null) return reading(null,densityReference);
  const prior = data.projects[project].samples.slice(0,-1).reverse()
    .map(sample=>averageFunctions(sample[metricsByLanguage[language]])).find(value=>value!=null);
  const change = prior > 0 ? Math.round((ratio/prior-1)*1e8)/1e6 : null;
  const detail = change == null ? 'No prior positive ratio for this project and language.'
    : 'Previous ratio '+number(prior)+' · change '+(change>0?'+':'')+number(change)+'%.';
  return {
    value:number(ratio),status:change == null ? 'measured' : densityReference.grade(change),
    rule:densityReference,detail,
    counts:number(report.functions)+'/'+number(report.files),
    countsLabel:number(report.functions)+' functions / '+number(report.files)+' files',
  };
}
function percent(report, rule, scope) {
  const value = report?.total > 0 ? 100*report.covered/report.total : null;
  const detail = value == null ? scope : number(report.covered)+' of '+number(report.total)+' '+scope;
  return reading(value,rule,detail,'%');
}
function testCoverage(project, language, sample) {
  const key = coverageByLanguage[language];
  const report = sample[key];
  const setting = sample.coverage_settings?.[key];
  const target = setting?.target ?? report?.target ?? (data.demo ? data.demoTargets?.coverage?.[key] : null);
  const manifest = /^[0-9a-f]{40}$/.test(sample.sha)
    ? 'https://github.com/enhantica/'+project+'/blob/'+sample.sha+'/pyproject.toml'
    : null;
  const anchor = Number.isInteger(setting?.line) && setting.line > 0 ? '#L'+setting.line : '';
  const source = data.demo
    ? reference('Demo data · illustrative target')
    : reference('Project CI · pyproject.toml',manifest ? manifest+anchor : null);
  const rule = Number.isFinite(target) ? atLeast(target,null,'%',source,{
    pass:'Meets the coverage target.',
    fail:'Below the coverage target.',
  }) : unratedCoverage;
  const scope = language === 'cpp' ? 'executable C++ lines covered'
    : project === 'crysta' ? 'public Python API entries exercised' : 'Python package statements covered';
  return percent(report,rule,scope);
}
function apiDocs(language, sample, source) {
  const scope = language === 'cpp' ? 'public header declarations documented (Doxygen)'
    : 'handwritten Python modules, classes and callables with docstrings';
  const result = percent(sample[docsByLanguage[language]],documentation,scope);
  const lines = source?.documentation_lines;
  if (Number.isFinite(lines)) {
    result.counts = number(lines);
    result.countsLabel = result.counts+' documentation lines across measured source (BCA)';
    result.detail += '. '+result.countsLabel+'.';
  }
  return result;
}
const groups = {
  verification: [
    {name:'Static checks',hint:'CI status',columns:{cpp:'C++ · clang-tidy',python:'Python · Ruff'},help:'Static analysis outcomes from CI. The C++ check scope varies by project.',read:(_project,language,sample)=>analyzer(sample,language)},
    {name:'Test coverage',hint:'Unit tier',help:'C++ counts executable lines. Python counts public API entries in crysta and package statements in edi. The green cutoff comes from each project’s CI configuration.',read:testCoverage},
    {name:'API documentation',hint:'% · lines',help:'Share of eligible items with documentation. C++ uses Doxygen public header declarations. Python uses handwritten docstrings. The percentage bands are dashboard references.',read:(_project,language,sample,source)=>apiDocs(language,sample,source)},
  ],
  maintainability: [
    {name:'Maintainability index',hint:'0–100',help:'BCA’s median file score on the Visual Studio index (0–100). Higher is better. It combines code size, cyclomatic complexity and Halstead volume.',read:(_project,_language,_sample,source)=>reading(source?.mi,maintainability)},
    {name:'Cyclomatic complexity',hint:'P90',help:'BCA’s 90th percentile of independent control-flow paths per function. The NIST guideline for individual modules serves as the P90 reference.',read:functionMetric('p90',10,rangeSources.nist)},
    {name:'Cognitive complexity',hint:'P90',help:'BCA’s 90th percentile of how hard a function’s control flow is to follow. SonarSource’s per-function defaults serve as the P90 references.',read:functionMetric('p90_cognitive',{cpp:25,python:15},rangeSources.sonar)},
  ],
  functions: [
    {name:'Function length',hint:'P90 · lines',help:'BCA’s 90th percentile of physical code lines per function.',read:functionMetric('p90_length',50,rangeSources.length)},
    {name:'Function arguments',hint:'P90',help:'BCA’s 90th percentile of arguments per callable. The per-function BCA default serves as the P90 reference.',read:functionMetric('p90_arguments',5,rangeSources.bcaArguments)},
    {name:'Function exits',hint:'P90',help:'BCA’s 90th percentile of explicit exits per function. The per-function BCA default serves as the P90 reference.',read:functionMetric('p90_exits',5,rangeSources.bcaExits)},
  ],
  size: [
    {name:'Physical code lines',hint:'Code only',help:'BCA physical code lines excluding blank and comment-only lines.',read:(_project,_language,_sample,source)=>reading(source?.components?.reduce((sum,item)=>sum+item.lines,0),measured)},
    {name:'Logical lines',hint:'Syntax-based',help:'BCA logical code lines counted from syntax, regardless of how the code is wrapped on screen.',read:(_project,_language,_sample,source)=>reading(source?.logical,measured)},
    {name:'Functions / files',hint:'Δ vs. prior',targetPrefix:'Δ ',help:'Average functions per file, followed by the raw function and file counts. The color compares percentage change against the previous measured snapshot for the same project and language.',read:(project,language,_sample,source)=>density(project,language,source)},
  ],
};

const tooltipContent = [];
function infoId(content) {
  return tooltipContent.push(content)-1;
}
function resultCell(card, result, project, language) {
  const {value,status,counts,countsLabel,detail,rule} = result;
  const title = card.name+' · '+project+' '+labels[language];
  const id = infoId({title,description:detail || card.help,references:[rule]});
  const label = title+' · '+value+(countsLabel ? ' · '+countsLabel : '')+(statusLabels[status] ? ' · '+statusLabels[status] : '');
  const mark = Object.hasOwn(statusSymbols,status)
    ? '<span class="mark" aria-hidden="true">'+statusSymbols[status]+'</span>' : '';
  return '<button type="button" class="info-trigger result '+status+'" data-info="'+id+'" aria-controls="metric-tooltip" aria-expanded="false" aria-label="'+
    escapeHtml(label)+'">'+mark+'<span class="value">'+escapeHtml(value)+'</span>'+
    (counts ? '<span class="counts">'+escapeHtml(counts)+'</span>' : '')+'</button>';
}
function headingReferences(rows) {
  const unique = new Map();
  for (const {project, results} of rows) {
    for (const [index, {rule}] of results.entries()) {
      const key = JSON.stringify([rule.source,rule.bands]);
      if (!unique.has(key)) unique.set(key,{rule, scopes:[]});
      unique.get(key).scopes.push({project,language:labels[languages[index]]});
    }
  }
  return [...unique.values()].map(({rule,scopes})=>{
    const byLanguage = scopes.every(scope=>scope.language===scopes[0].language) && scopes.length===projects.length;
    const byProject = scopes.every(scope=>scope.project===scopes[0].project) && scopes.length===languages.length;
    const name = byLanguage ? scopes[0].language : byProject ? scopes[0].project
      : scopes.map(scope=>scope.project+' '+scope.language).join(' · ');
    return {...rule,name:unique.size>1 ? name : ''};
  });
}
function renderCard(group, card) {
  const rows = projects.map(project=>{
    const snapshot = data.projects[project].samples.at(-1) ?? {};
    const results = languages.map(language=>card.read(project,language,snapshot,snapshot[metricsByLanguage[language]]));
    return {project,results};
  });
  const heads = languages.map((language,index)=>{
    const targets = [...new Set(rows.map(({results})=>results[index].rule.target).filter(Boolean))];
    const suffix = targets.length===1 ? ' '+(card.targetPrefix ?? '')+targets[0] : targets.length>1 ? ' · per project' : '';
    return '<span>'+escapeHtml(card.columns?.[language] ?? labels[language]+suffix)+'</span>';
  }).join('');
  const readings = rows.map(({project,results})=>'<div class="reading"><span>'+project+'</span><div class="values">'+
    results.map((result,index)=>resultCell(card,result,project,languages[index])).join('')+'</div></div>').join('');
  const id = infoId({title:card.name,description:card.help,references:headingReferences(rows)});
  return '<article class="card" data-group="'+group+'"><h2><button type="button" class="info-trigger card-info" data-info="'+id+'" aria-controls="metric-tooltip" aria-expanded="false">'+
    '<span class="icon icon-'+group+'" aria-hidden="true"></span><span>'+card.name+'</span>'+
    '<span class="hint">'+card.hint+'</span><span class="help-mark" aria-hidden="true">i</span></button></h2><div class="readings">'+
    '<div class="language-head" aria-hidden="true"><div></div><div>'+heads+'</div></div>'+readings+'</div></article>';
}
document.querySelector('#demo-label').hidden = !data.demo;
document.querySelector('#cards').innerHTML = Object.entries(groups)
  .flatMap(([group,cards])=>cards.map(card=>renderCard(group,card))).join('');

const tooltip = document.querySelector('#metric-tooltip');
let activeTrigger;
let pinned = false;
let closeTimer;
function positionTooltip() {
  if (!activeTrigger) return;
  const anchor = activeTrigger.getBoundingClientRect();
  const width = document.documentElement.clientWidth;
  const height = document.documentElement.clientHeight;
  const maxLeft = width-tooltip.offsetWidth-12;
  const left = Math.min(Math.max(12,anchor.left),maxLeft);
  const below = anchor.bottom+6;
  const above = anchor.top-tooltip.offsetHeight-6;
  const top = below+tooltip.offsetHeight <= height-12 ? below : Math.max(12,above);
  tooltip.style.left = left+'px';
  tooltip.style.top = top+'px';
}
function hideTooltip() {
  clearTimeout(closeTimer);
  activeTrigger?.removeAttribute('aria-describedby');
  activeTrigger?.setAttribute('aria-expanded','false');
  activeTrigger = null;
  pinned = false;
  tooltip.hidden = true;
}
function showTooltip(trigger) {
  clearTimeout(closeTimer);
  if (trigger===activeTrigger) return;
  hideTooltip();
  const {title,description,references} = tooltipContent[trigger.dataset.info];
  tooltip.innerHTML = '<strong id="metric-tooltip-title">'+escapeHtml(title)+'</strong><p>'+escapeHtml(description)+'</p>'+
    references.map(({name,source,bands})=>{
      const label = escapeHtml(name ? name+' · '+source.label : source.label);
      const sourceLink = source.href ? '<a href="'+escapeHtml(source.href)+'" target="_blank" rel="noopener">'+
        label+' <span aria-hidden="true">↗</span></a>' : label;
      return '<span class="range-label">'+sourceLink+'</span>'+
        '<ul class="range-list">'+bands.map(({tone,range,note})=>'<li class="'+tone+'"><b>'+escapeHtml(range)+
          '</b><span>'+escapeHtml(note)+'</span></li>').join('')+'</ul>';
    }).join('');
  (trigger.closest('h2') ?? trigger).after(tooltip);
  activeTrigger = trigger;
  trigger.setAttribute('aria-describedby','metric-tooltip-title');
  trigger.setAttribute('aria-expanded','true');
  tooltip.hidden = false;
  positionTooltip();
}
function scheduleClose() {
  clearTimeout(closeTimer);
  if (!pinned && !activeTrigger?.matches(':focus-visible') && !tooltip.contains(document.activeElement)) {
    closeTimer = setTimeout(hideTooltip,140);
  }
}
for (const trigger of document.querySelectorAll('.info-trigger')) {
  trigger.addEventListener('pointerenter',event=>{
    if (event.pointerType!=='touch' && !pinned && !tooltip.contains(document.activeElement)) showTooltip(trigger);
  });
  trigger.addEventListener('pointerleave',()=>{
    if (activeTrigger===trigger) scheduleClose();
  });
  trigger.addEventListener('focus',()=>showTooltip(trigger));
  trigger.addEventListener('blur',event=>{
    if (activeTrigger===trigger && !tooltip.contains(event.relatedTarget) && !(pinned && !event.relatedTarget)) {
      hideTooltip();
    }
  });
  trigger.addEventListener('click',()=>{
    if (activeTrigger===trigger && pinned) hideTooltip();
    else {
      showTooltip(trigger);
      pinned = true;
    }
  });
}
tooltip.addEventListener('pointerenter',()=>clearTimeout(closeTimer));
tooltip.addEventListener('pointerleave',scheduleClose);
tooltip.addEventListener('pointerdown',()=>{
  clearTimeout(closeTimer);
  pinned = true;
});
tooltip.addEventListener('focusin',()=>clearTimeout(closeTimer));
tooltip.addEventListener('focusout',event=>{
  if (event.relatedTarget!==activeTrigger && !tooltip.contains(event.relatedTarget)) hideTooltip();
});
document.addEventListener('click',event=>{
  if (!event.target.closest('.info-trigger, .metric-tooltip')) hideTooltip();
});
document.addEventListener('keydown',event=>{
  if (event.key==='Escape') {
    if (tooltip.contains(document.activeElement)) activeTrigger?.focus();
    hideTooltip();
  }
});
window.addEventListener('resize',positionTooltip);
window.addEventListener('scroll',positionTooltip,{passive:true});
</script>
</body>
</html>
